# ==============================================================================
# UCust AI Microservice Compose Stack (Development & Staging)
# Orchestrates FastAPI Gateway, Celery Workers, Redis, and pgvector.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL with pgvector (Persistent Multi-Tenant RAG Store)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ucust_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ucust_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucust_secure_postgres_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ucust_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 2. Redis Message Broker & Result Backend
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ucust_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 3. FastAPI Service Gateway (REST API, WebSockets & Prometheus Metrics)
  # ----------------------------------------------------------------------------
  fastapi-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucust_fastapi_gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ucust_secure_postgres_pass_2026}@postgres:5432/${POSTGRES_DB:-ucust_ai}
      - REDIS_URL=redis://redis:6379/0
      - UCUST_DB_HOST=postgres
      - UCUST_DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEV_SIMULATION_MODE=${DEV_SIMULATION_MODE:-true}
    ports:
      - "8000:8000"
    volumes:
      - output_media:/app/output/photos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ai/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 4. Celery CPU Worker (Queues: custom, business, start)
  # Ingests Web, Telegram, Docs, RAG Search, and Saiga LLM text generation
  # ----------------------------------------------------------------------------
  celery-worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucust_celery_worker_cpu
    restart: unless-stopped
    command: celery -A celery_tasks.celery_app worker --loglevel=info --concurrency=2 -Q custom,business,start
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ucust_secure_postgres_pass_2026}@postgres:5432/${POSTGRES_DB:-ucust_ai}
      - REDIS_URL=redis://redis:6379/0
      - UCUST_DB_HOST=postgres
      - UCUST_DB_PORT=5432
      - DEV_SIMULATION_MODE=${DEV_SIMULATION_MODE:-true}
    volumes:
      - output_media:/app/output/photos
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 5. Celery GPU Worker (Queues: custom, business, start)
  # Lazy Rendering & ComfyUI Prompt API execution
  # ----------------------------------------------------------------------------
  celery-worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucust_celery_worker_gpu
    restart: unless-stopped
    command: celery -A celery_tasks.celery_app worker --loglevel=info --concurrency=1 -Q custom,business,start
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ucust_secure_postgres_pass_2026}@postgres:5432/${POSTGRES_DB:-ucust_ai}
      - REDIS_URL=redis://redis:6379/0
      - UCUST_DB_HOST=postgres
      - UCUST_DB_PORT=5432
      - DEV_SIMULATION_MODE=${DEV_SIMULATION_MODE:-true}
    volumes:
      - output_media:/app/output/photos
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 6. Observability: Prometheus (Monitoring Profile)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: ucust_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ucust_internal_net

  # ----------------------------------------------------------------------------
  # 7. Observability: Grafana (Monitoring Profile)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: ucust_grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ucust_internal_net

# ------------------------------------------------------------------------------
# Volumes & Networks Definitions
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  output_media:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  ucust_internal_net:
    driver: bridge
