# ==============================================================================
# UCust AI Nginx Reverse Proxy & Edge Security Configuration
# ==============================================================================

worker_processes auto;

events { 
    worker_connections 2048; 
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Оптимизация отдачи файлов (Zero-copy)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Зоны ограничения запросов (защита от спама генераций)
    # Зона 'ai_api_limit': 10MB памяти (~160k IP-адресов), лимит 5 запросов в секунду
    limit_req_zone $binary_remote_addr zone=ai_api_limit:10m rate=5r/s;

    upstream fastapi_backend {
        server fastapi-gateway:8000;
        keepalive 32;
    }

    server {
        listen 80;
        listen 443 ssl http2;
        server_name ai.ucust.ai;

        # SSL Сертификаты (подключаются через Volume в docker-compose)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. Прямая раздача медиафайлов (минуя FastAPI/Celery)
        location /output/photos/ {
            alias /opt/ucust/ai/output/photos/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 2. Проксирование WebSocket для стримов статуса
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Server-Sent Events (SSE) Live Pipeline Streaming (Zero Buffering)
        location /api/v1/pipeline/stream/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Критические директивы для бесперебойного SSE стриминга
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Защита от сброса соединения при генерации объемных медиа/пайплайнов
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 4. Маршрутизация API с Rate Limiting
        location /api/ {
            # burst=10 допускает кратковременные всплески, nodelay применяет лимит сразу
            limit_req zone=ai_api_limit burst=10 nodelay;
            
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Проксирование Prometheus Metrics
        location /metrics {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Health Check
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }
    }
}
